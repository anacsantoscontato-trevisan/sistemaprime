<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pedidos - Admin</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        const s = JSON.parse(sessionStorage.getItem('usuarioLogado'));
        // Linha de segurança (descomentar em produção)
        // if (!s || !s.logado) window.location.href = "index.html"; 
    </script>

    <style>
        /* --- TEMA GERAL --- */
        :root {
            --bg-body: #121212; --bg-panel: #1e1e1e; --bg-input: #2c2c2c;
            --border: #333; --text: #fff; --text-sec: #aaa;
            --primary: #D4AF37; --success: #2ecc71; --danger: #e74c3c;
            --edit: #f39c12; --draft: #9b59b6;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        body.light-mode {
            --bg-body: #f4f4f9; --bg-panel: #ffffff; --bg-input: #f0f0f0;
            --border: #ddd; --text: #333; --text-sec: #666;
            --primary: #b5952f;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-body); color: var(--text);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 900px;
            background: var(--bg-panel);
            padding: 30px; border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        h2 { margin: 0; color: var(--primary); text-transform: uppercase; font-size: 1.5rem; }
        
        .theme-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 18px; }
        .logout { position: absolute; top: 20px; right: 20px; color: var(--text-sec); cursor: pointer; font-size: 14px; font-weight: bold; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--text-sec); text-transform: uppercase; }
        input {
            width: 100%; padding: 12px; background: var(--bg-input);
            border: 1px solid var(--border); border-radius: 6px;
            color: var(--text); outline: none; box-sizing: border-box;
        }

        .catalog-area { background: var(--bg-input); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; border-left: 4px solid var(--primary); }
        .catalog-area.editing { border-color: var(--edit); background: rgba(243, 156, 18, 0.1); }
        
        .grid-aros { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 5px; margin-top: 15px; }
        .aro-box { background: var(--bg-panel); padding: 5px; border: 1px solid var(--border); text-align: center; border-radius: 4px; }
        .aro-label { font-size: 10px; font-weight: bold; margin-bottom: 2px; color: var(--text-sec); }
        .aro-input { width: 100%; text-align: center; font-size: 12px; padding: 4px; height: 25px; }
        .input-sem { border-bottom: 2px solid #ccc; }
        .input-com { border-bottom: 2px solid #f1c40f; }

        .table-screen { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .table-screen th { background: var(--bg-input); padding: 10px; text-align: left; border-bottom: 2px solid var(--border); color: var(--primary); }
        .table-screen td { padding: 10px; border-bottom: 1px solid var(--border); }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; margin-top: 10px; text-transform: uppercase; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-add { background: var(--success); }
        .btn-update { background: var(--edit); color: #fff; }
        .btn-pdf { background: var(--danger); }
        .btn-save { background: var(--success); }
        .btn-draft { background: var(--draft); color: white; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 16px; margin-left: 5px; }
        
        /* ==========================================================================
           ESTILOS DO PDF (COMPACTO)
           ========================================================================== */
        #print-area { display: none; }
        
        /* PÁGINA A4 - Margens reduzidas */
        .pdf-page {
            width: 100%; min-height: 290mm;
            page-break-after: always;
            position: relative;
            display: block;
            padding: 15px 25px; 
            box-sizing: border-box;
            background: #fff; color: #000; font-family: 'Arial', sans-serif;
        }
        
        /* CABEÇALHO */
        .pdf-page-header { 
            border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px; width: 100%; 
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .pdf-title-main { font-size: 18px; font-weight: 900; text-transform: uppercase; margin: 0; }
        .pdf-subtitle { font-size: 11px; color: #000; margin-top: 2px; }

        /* BOX DE INFORMAÇÕES */
        .pdf-prod-info-box { 
            background: #f0f0f0; border: 1px solid #000; padding: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 10px;
        }
        .model-name { font-size: 24px; font-weight: 900; }
        .model-meta { font-size: 12px; margin-top: 2px; }
        .model-right { text-align: right; font-size: 11px; line-height: 1.3; }
        
        /* TABELA DE ARRUELAS (MINI) - MESMA PROPORÇÃO */
        .tbl-mini { border-collapse: collapse; margin-top: 0px; margin-bottom: 10px; border: 2px solid #000; width: 40%; }
        .tbl-mini th { background: #000; color: #fff; padding: 3px; font-size: 11px; border: 1px solid #000; text-transform: uppercase; }
        .tbl-mini td { border: 1px solid #ccc; padding: 3px; text-align: center; font-weight: bold; font-size: 12px; }

        /* TABELA DE AROS */
        .tbl-aros { width: 100%; border-collapse: collapse; margin-top: 5px; border: 2px solid #000; }
        .tbl-aros th { background: #000; color: #fff; padding: 4px; font-size: 12px; border: 1px solid #000; text-transform: uppercase; }
        .tbl-aros td { border: 1px solid #ccc; padding: 3px; text-align: center; font-weight: bold; font-size: 13px; }
        .col-aro { background: #e0e0e0; width: 15%; }
        .col-sem { width: 42.5%; }
        .col-com { background: #fffde7; width: 42.5%; }

        /* RODAPÉ DE CONFERÊNCIA */
        .pdf-conference-section { 
            margin-top: 15px; 
            border-top: 2px solid #000; 
            padding-top: 10px;
        }
        
        .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .type-box { border: 1px solid #000; padding: 8px; background: #fff; }
        .box-header { background: #000; color: #fff; font-weight: bold; text-align: center; padding: 4px; font-size: 12px; margin: -8px -8px 8px -8px; }

        .conf-line { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; }
        .manual-line { border-bottom: 1px solid #000; width: 70px; display: inline-block; height: 14px; }

        /* PÁGINA FINAL */
        .pdf-summary-page {
            width: 100%; min-height: 290mm;
            page-break-before: always; page-break-after: avoid;
            background: #fff; color: #000; font-family: 'Arial', sans-serif;
            display: flex; flex-direction: column; align-items: center;     
            padding: 40px; box-sizing: border-box;
        }
        .summary-content { width: 100%; border: 2px solid #000; padding: 20px; box-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .resumo-title { text-align: center; font-size: 18px; font-weight: 900; margin-bottom: 15px; text-decoration: underline; text-transform: uppercase; }
        
        .tbl-resumo { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; border: 1px solid #000; }
        .tbl-resumo th { background: #ddd; color: #000; padding: 6px; text-align: left; border: 1px solid #999; }
        .tbl-resumo td { border: 1px solid #ccc; padding: 6px; }
        .row-total { font-weight: 900; font-size: 14px; background: #eee; }
    </style>
</head>
<body>

    <div class="logout" onclick="sessionStorage.clear(); window.location.href='index.html'">SAIR ➜</div>

    <div class="app-container">
        <div class="header-row">
            <h2>Gestão de Pedidos</h2>
            <button class="theme-btn" onclick="toggleTheme()" title="Alternar Tema">🌓</button>
        </div>

        <div class="form-row">
            <div class="input-group"><label>Cliente</label><input type="text" id="cliente" placeholder="Nome do Cliente"></div>
            <div class="input-group"><label>Nº OS</label><input type="text" id="os" placeholder="Ex: 1050"></div>
        </div>

        <div class="catalog-area" id="painel-adicao">
            <label style="color:var(--text); font-weight:bold;" id="label-painel">Adicionar Manualmente:</label>
            <input list="lista-modelos" id="input-modelo" placeholder="🔍 Busque o modelo ou Digite um novo..." disabled onchange="carregarGrade()" style="margin-top:10px;">
            <datalist id="lista-modelos"></datalist>
            
            <div id="grade-wrapper" style="display:none;">
                <p style="font-size:13px; margin-top:15px; color:var(--text-sec); text-align:center;">DIGITE AS QUANTIDADES:</p>
                <div class="grid-aros" id="container-aros"></div>
                
                <div style="margin-top:20px; display:flex; gap:15px; align-items:center; justify-content:center; flex-wrap:wrap; background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;">
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <label style="font-size:11px; font-weight:bold;">Peso (g):</label>
                        <input type="number" id="peso-manual" step="0.1" style="width:100px; padding:8px; text-align:center;">
                    </div>
                    <div style="display:flex; align-items:center; gap:5px;">
                        <input type="checkbox" id="chk-peso-total" style="width:20px; height:20px;">
                        <label for="chk-peso-total" style="font-size:12px; cursor:pointer;">É o Peso Total?<br><small style="color:var(--text-sec)">(Dividir pela Qtd)</small></label>
                    </div>
                </div>

                <button class="btn btn-add" id="btn-acao" onclick="adicionarProdutoManual()">⬇ INCLUIR NO PEDIDO</button>
                <button class="btn btn-pdf" id="btn-cancelar-edicao" onclick="cancelarEdicao()" style="display:none; background:#555;">CANCELAR</button>
            </div>
        </div>

        <h3 style="color:var(--text); border-bottom:1px solid var(--border); padding-bottom:5px;">Itens do Pedido</h3>
        <table class="table-screen">
            <thead><tr><th>Modelo</th><th>Resumo</th><th>Qtd</th><th>Peso Est.</th><th>Ação</th></tr></thead>
            <tbody id="lista-pedidos"></tbody>
        </table>

        <div class="btn-row">
            <button class="btn btn-pdf" onclick="gerarPDF()">📄 GERAR PDF</button>
            <button class="btn btn-draft" id="btn-draft" onclick="enviar('Rascunho')">☁ SALVAR RASCUNHO</button>
            <button class="btn btn-save" id="btn-save" onclick="enviar('Pendente')">💾 FINALIZAR PEDIDO</button>
        </div>
        <p style="text-align:center; font-size:12px; color:var(--text-sec); margin-top:10px;" id="msg-rascunho-local"></p>
    </div>

    <div id="print-area">
        <div id="pdf-content"></div>
    </div>

<script>
    // ✅ LINK DO SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbxG-lUBjVOD1ZtO6Lay2OD4P0YzhbJxaa1lBNmneZAO2h4qd_PKqY6Ar16edTHLOT-q_w/exec";

    let catalogo = [], carrinho = [], produtoSelecionado = null;
    let indiceEdicao = null; 

    window.onload = async function() {
        if(localStorage.getItem('admin_theme') === 'light') document.body.classList.add('light-mode');
        carregarRascunhoLocal();
        await carregarCatalogoNuvem();
        document.getElementById('cliente').addEventListener('input', salvarRascunhoLocal);
        document.getElementById('os').addEventListener('input', salvarRascunhoLocal);
    };

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('admin_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    async function carregarCatalogoNuvem() {
        const input = document.getElementById("input-modelo");
        try {
            const res = await fetch(`${API_URL}?action=GET_PRODUCTS`);
            const dados = await res.json();
            if (dados && dados.length > 0) {
                catalogo = dados.map(item => ({
                    id: String(item.m), nome: item.d, pb: parseFloat(item.pb || 0), pa: parseFloat(item.pa || 0),
                    grife: item.grife, mat: item.mat, mm: extrairMM(item.d)
                }));
                const dl = document.getElementById("lista-modelos"); dl.innerHTML = "";
                catalogo.forEach(p => { let op = document.createElement("option"); op.value = p.id; op.label = p.nome; dl.appendChild(op); });
                input.placeholder = "🔍 Buscar modelo ou Digite um novo..."; input.disabled = false;
            }
        } catch (e) { console.error(e); }
    }

    function extrairMM(desc) { let match = desc.match(/(\d+[,.]?\d*)\s*MM/i); return match ? parseFloat(match[1].replace(',','.')) : 0; }

    function carregarGrade() {
        const input = document.getElementById("input-modelo");
        const codigo = input.value.trim();
        if(!codigo) return;
        let produto = catalogo.find(p => p.id === codigo);
        if (!produto) produto = { id: "MANUAL", nome: codigo.toUpperCase(), pa: 0, pb: 0, mm: 0, isManual: true };
        produtoSelecionado = produto;
        
        document.getElementById("grade-wrapper").style.display = "block"; 
        document.getElementById("container-aros").innerHTML = "";
        document.getElementById("peso-manual").value = produto.pa || 0;
        document.getElementById("chk-peso-total").checked = false; 

        for(let i=10; i<=33; i++) {
            document.getElementById("container-aros").innerHTML += `
            <div class="aro-box"><div class="aro-label">${i}</div>
            <input type="number" id="sem-${i}" class="aro-input input-sem" placeholder="S">
            <input type="number" id="com-${i}" class="aro-input input-com" placeholder="C"></div>`;
        }
        setTimeout(()=>document.getElementById("sem-10").focus(), 100);
    }

    function adicionarProdutoManual() {
        if(!produtoSelecionado) return;
        let gradeReal = [], gradeSemFull = {}, gradeComFull = {}, qtdTotal = 0;
        for(let i=10; i<=33; i++) {
            let qSem = parseInt(document.getElementById(`sem-${i}`).value) || 0;
            let qCom = parseInt(document.getElementById(`com-${i}`).value) || 0;
            gradeSemFull[i] = qSem; gradeComFull[i] = qCom;
            if(qSem > 0) { gradeReal.push({ aro: i, qtd: qSem, tipo: 'sem' }); qtdTotal += qSem; }
            if(qCom > 0) { gradeReal.push({ aro: i, qtd: qCom, tipo: 'com' }); qtdTotal += qCom; }
        }
        if(qtdTotal === 0) return alert("Preencha ao menos uma quantidade.");

        let pesoInput = parseFloat(document.getElementById("peso-manual").value) || 0;
        let isPesoTotal = document.getElementById("chk-peso-total").checked;
        let pesoUnitarioFinal = (isPesoTotal && qtdTotal > 0) ? pesoInput / qtdTotal : (pesoInput || produtoSelecionado.pa);
        let produtoAtualizado = { ...produtoSelecionado, pa: pesoUnitarioFinal };
        if(produtoSelecionado.isManual) produtoAtualizado.id = produtoSelecionado.nome;

        const itemNovo = { produto: produtoAtualizado, gradeReal, gradeSemFull, gradeComFull, arruelas: calcularArruelas(produtoAtualizado.mm, gradeReal) };

        if (indiceEdicao !== null) { carrinho[indiceEdicao] = itemNovo; cancelarEdicao(); } 
        else { carrinho.push(itemNovo); limparFormulario(); }
        renderizarTabela(); salvarRascunhoLocal();
    }

    function editarItem(idx) {
        const item = carrinho[idx];
        indiceEdicao = idx; produtoSelecionado = item.produto;
        document.getElementById("input-modelo").value = item.produto.id;
        document.getElementById("label-painel").innerText = "Editando Item: " + item.produto.id;
        document.getElementById("btn-acao").innerText = "💾 SALVAR ALTERAÇÃO";
        document.getElementById("btn-acao").className = "btn btn-update";
        document.getElementById("btn-cancelar-edicao").style.display = "inline-block";
        document.querySelector(".catalog-area").classList.add("editing");
        carregarGrade(); 
        setTimeout(() => {
            document.getElementById("peso-manual").value = item.produto.pa.toFixed(2);
            for(let i=10; i<=33; i++) {
                if(item.gradeSemFull[i]) document.getElementById(`sem-${i}`).value = item.gradeSemFull[i];
                if(item.gradeComFull[i]) document.getElementById(`com-${i}`).value = item.gradeComFull[i];
            }
        }, 50);
    }

    function cancelarEdicao() { indiceEdicao = null; limparFormulario(); }
    function limparFormulario() {
        document.getElementById("input-modelo").value = ""; document.getElementById("grade-wrapper").style.display = "none"; 
        produtoSelecionado = null; document.getElementById("peso-manual").value = "";
        document.getElementById("label-painel").innerText = "Adicionar Manualmente:";
        document.getElementById("btn-acao").innerText = "⬇ INCLUIR NO PEDIDO";
        document.getElementById("btn-acao").className = "btn btn-add";
        document.getElementById("btn-cancelar-edicao").style.display = "none";
        document.querySelector(".catalog-area").classList.remove("editing");
    }

    function calcularArruelas(mm, gradeReal) {
        let arruelas = {};
        gradeReal.forEach(item => {
            let cat = item.aro>=10&&item.aro<=24?'P':(item.aro>=25&&item.aro<=28?'M':(item.aro>=29?'G':''));
            if(!cat || !mm) return;
            let code = "";
            if(mm<=3) code = cat==='P'?'B-23':(cat==='M'?'B-29':'B-33');
            else if(mm===4) code = cat==='P'?'C-21':(cat==='M'?'C-29':'C-33');
            else if(mm>=5 && mm<=6) code = cat==='P'?'D-21':(cat==='M'?'D-29':'D-33');
            else if(mm>=7 && mm<=8) code = cat==='P'?'E-23':(cat==='M'?'E-29':'E-33');
            else if(mm>=9) code = cat==='P'?'F-23':(cat==='M'?'F-29':'F-33');
            if(code) arruelas[code] = (arruelas[code] || 0) + item.qtd;
        });
        return arruelas;
    }

    function renderizarTabela() {
        const tb = document.getElementById("lista-pedidos"); tb.innerHTML = "";
        carrinho.forEach((item, idx) => {
            let qtd = item.gradeReal.reduce((a,b)=>a+b.qtd,0);
            let pesoTotal = (qtd * item.produto.pa).toFixed(2);
            tb.innerHTML += `<tr><td>${item.produto.nome} (${item.produto.id})</td><td>Misto</td><td style="font-weight:bold; color:var(--primary);">${qtd}</td><td>${pesoTotal}g</td>
            <td><button onclick="editarItem(${idx})" class="action-btn">📝</button><button onclick="rmItem(${idx})" class="action-btn" style="color:red;">🗑️</button></td></tr>`;
        });
    }
    
    function rmItem(idx) { if(indiceEdicao===idx) cancelarEdicao(); carrinho.splice(idx,1); renderizarTabela(); salvarRascunhoLocal(); }

    function salvarRascunhoLocal() {
        const dados = { carrinho: carrinho, cliente: document.getElementById('cliente').value, os: document.getElementById('os').value, data: new Date().toLocaleTimeString() };
        localStorage.setItem('rascunho_auto', JSON.stringify(dados));
        document.getElementById('msg-rascunho-local').innerText = "✅ Salvo localmente às " + dados.data;
    }

    function carregarRascunhoLocal() {
        const salvo = localStorage.getItem('rascunho_auto');
        if(salvo) {
            try {
                const dados = JSON.parse(salvo);
                if(dados.carrinho.length > 0 || dados.cliente || dados.os) {
                    document.getElementById('cliente').value = dados.cliente || "";
                    document.getElementById('os').value = dados.os || "";
                    carrinho = dados.carrinho || [];
                    renderizarTabela();
                    document.getElementById('msg-rascunho-local').innerText = "🔄 Rascunho restaurado de " + dados.data;
                }
            } catch(e) { console.log(e); }
        }
    }

    function limparRascunhoLocal() { localStorage.removeItem('rascunho_auto'); document.getElementById('msg-rascunho-local').innerText = ""; }

    function gerarPDF() {
        if(carrinho.length === 0) return alert("Pedido vazio.");
        const cliNome = document.getElementById("cliente").value || "Cliente Não Informado";
        const osNum = document.getElementById("os").value || "S/N";
        const dataHoje = new Date().toLocaleDateString();
        const container = document.getElementById("pdf-content"); container.innerHTML = "";
        
        let rowsResumo = "";
        let grandTotalQtd = 0;
        let grandTotalPeso = 0;
        let totalPaginas = carrinho.length + 1;

        carrinho.forEach((grupo, index) => {
            let tSem=0, tCom=0, htmlRows="";
            for(let i=10; i<=33; i++) {
                let vS = grupo.gradeSemFull[i] || ""; let vC = grupo.gradeComFull[i] || "";
                if(vS) tSem+=vS; if(vC) tCom+=vC;
                htmlRows += `<tr><td class="col-aro">${i}</td><td class="col-sem">${vS}</td><td class="col-com">${vC}</td></tr>`;
            }

            let totalQtd = tSem+tCom;
            let totalPeso = (totalQtd * grupo.produto.pa);
            grandTotalQtd += totalQtd; grandTotalPeso += totalPeso;
            
            let pSem = tSem * grupo.produto.pa;
            let pCom = tCom * grupo.produto.pa;

            rowsResumo += `<tr><td>${grupo.produto.id}</td><td>${grupo.produto.nome}</td><td style="text-align:center">${totalQtd}</td><td style="text-align:right">${totalPeso.toFixed(2)}g</td></tr>`;
            
            // GERA TABELA MINI DE ARRUELAS
            let htmlArruelas = "";
            if(Object.keys(grupo.arruelas).length > 0) {
                Object.entries(grupo.arruelas).forEach(([k,v]) => {
                    htmlArruelas += `<tr><td>${k}</td><td>${v}</td></tr>`;
                });
            } else {
                htmlArruelas = `<tr><td colspan="2">-</td></tr>`;
            }

            container.innerHTML += `
            <div class="pdf-page">
                <div class="pdf-page-header">
                    <div class="pdf-header-left">
                        <div class="pdf-title-main">PEDIDO DE REPOSIÇÃO</div>
                        <div class="pdf-subtitle"><strong>OS:</strong> ${osNum} | <strong>CLIENTE:</strong> ${cliNome}</div>
                    </div>
                    <div class="pdf-header-right">
                         <div class="pdf-subtitle">${dataHoje}</div>
                         <div class="pdf-subtitle">Pág ${index+1}/${totalPaginas}</div>
                    </div>
                </div>

                <div class="pdf-prod-info-box">
                    <div>
                        <div class="model-name">${grupo.produto.nome}</div>
                        <div class="model-meta">REF: <strong>${grupo.produto.id}</strong> | MM: <strong>${grupo.produto.mm}mm</strong></div>
                    </div>
                    <div class="model-right">
                        <div>Unit: <strong>${grupo.produto.pa.toFixed(2)}g</strong></div>
                    </div>
                </div>

                <table class="tbl-mini">
                    <thead><tr><th>CÓD ARRUELA</th><th>QTD</th></tr></thead>
                    <tbody>${htmlArruelas}</tbody>
                </table>

                <table class="tbl-aros">
                    <thead><tr><th>ARO</th><th>SEM PEDRA</th><th>COM PEDRA</th></tr></thead>
                    <tbody>${htmlRows}</tbody>
                </table>

                <div class="pdf-conference-section">
                    <div class="split-grid">
                         <div class="type-box">
                             <div class="box-header">SEM PEDRA</div>
                             <div class="conf-line"><span>QTD SIST:</span> <strong>${tSem}</strong></div>
                             <div class="conf-line"><span>PESO EST:</span> <strong>${pSem.toFixed(2)}g</strong></div>
                             <div class="conf-line" style="margin-top:10px;"><span>QTD REAL:</span> <span class="manual-line"></span></div>
                             <div class="conf-line"><span>PESO REAL:</span> <span class="manual-line"></span></div>
                         </div>
                         
                         <div class="type-box">
                             <div class="box-header">COM PEDRA</div>
                             <div class="conf-line"><span>QTD SIST:</span> <strong>${tCom}</strong></div>
                             <div class="conf-line"><span>PESO EST:</span> <strong>${pCom.toFixed(2)}g</strong></div>
                             <div class="conf-line" style="margin-top:10px;"><span>QTD REAL:</span> <span class="manual-line"></span></div>
                             <div class="conf-line"><span>PESO REAL:</span> <span class="manual-line"></span></div>
                         </div>
                    </div>
                </div>
            </div>`;
        });

        // PÁGINA FINAL
        container.innerHTML += `
        <div class="pdf-summary-page">
            <div class="summary-content">
                <div class="resumo-title">ROMANEIO GERAL - OS ${osNum}</div>
                <div style="margin-bottom:15px; font-size:12px; display:flex; justify-content:space-between; border-bottom:1px solid #000; padding-bottom:5px;">
                     <div><strong>CLIENTE:</strong> ${cliNome}</div>
                     <div><strong>DATA:</strong> ${dataHoje}</div>
                </div>
                <table class="tbl-resumo">
                    <thead><tr><th>REF</th><th>MODELO</th><th style="width:10%">QTD</th><th style="width:20%">PESO EST.</th></tr></thead>
                    <tbody>
                        ${rowsResumo}
                        <tr class="row-total">
                            <td colspan="2" style="text-align:right">TOTAIS:</td>
                            <td style="text-align:center">${grandTotalQtd}</td>
                            <td style="text-align:right">${grandTotalPeso.toFixed(2)}g</td>
                        </tr>
                    </tbody>
                </table>
                <div style="text-align:center; font-size:10px; color:#555; margin-top:20px;">Página ${totalPaginas}/${totalPaginas}</div>
            </div>
        </div>`;

        const el = document.getElementById('print-area'); el.style.display = 'block';
        const opt = { 
            margin: 0, 
            filename: `Pedido_${osNum}.pdf`, 
            image: { type: 'jpeg', quality: 0.98 }, 
            html2canvas: { scale: 2, useCORS: true }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
        };
        html2pdf().set(opt).from(el).save().then(() => { el.style.display = 'none'; });
    }

    function enviar(status) {
        if(carrinho.length === 0) return alert("Pedido vazio.");
        const osVal = document.getElementById("os").value; if(!osVal) return alert("Preencha a OS.");
        const btnID = status === 'Rascunho' ? 'btn-draft' : 'btn-save';
        const btn = document.getElementById(btnID); const txtOriginal = btn.innerText;
        btn.innerText = "⏳ ENVIANDO..."; btn.disabled=true;
        let itens = [];
        carrinho.forEach(i => { i.gradeReal.forEach(g => { itens.push({ modelo: i.produto.nome, referencia: i.produto.id, pesoBruto: i.produto.pb, pesoAcabado: i.produto.pa, tipo: g.tipo === 'sem' ? 'Sem Pedra' : 'Com Pedra', aro: g.aro, qtd: g.qtd }); }); });
        
        fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "ATUALIZAR_PEDIDO_ROMANEIO", cliente: document.getElementById("cliente").value, os: osVal, itens: itens, status: status }) })
        .then(()=>{ alert(status === 'Rascunho' ? "✅ Rascunho salvo na nuvem!" : "✅ Pedido finalizado!"); if(status !== 'Rascunho') limparRascunhoLocal(); })
        .catch(()=>{ alert("Erro de conexão."); }).finally(() => { btn.disabled=false; btn.innerText = txtOriginal; });
    }
</script>
</body>
</html>
