<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferência</title>
    <style>
        body { font-family: sans-serif; background: #050505; color: #fff; text-align: center; padding: 20px; }
        .box { max-width: 400px; margin: 0 auto; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #D4AF37; font-weight: bold; border: none; cursor: pointer; border-radius: 6px; }
        .card { background: #1a1a1a; padding: 15px; margin-top: 20px; border: 1px solid #333; border-radius: 8px; text-align: left; }
        .line { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; font-size: 14px; }
        .val { color: #D4AF37; font-weight: bold; }
        .ok { color: #2ecc71; text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h3>🔍 Conferência de Saída</h3>
    <input type="text" id="busca" placeholder="Digite a OS">
    <select id="loja">
        <option value="" disabled selected>Destino</option>
        <option value="Loja 01">Loja 01</option>
        <option value="Loja 02">Loja 02</option>
    </select>
    <button onclick="buscar()">BUSCAR</button>
    
    <div id="resultado"></div>
</div>

<script>
    // ⬇️ COLE SEU LINK NOVO AQUI ⬇️
    const LINK_SCRIPT = "https://script.google.com/macros/s/AKfycbxrJ_yMfPRNwFALZO_QOptOfYWieN-fiMBjawU8sFInnwpSwLD9dYfddJ7tHfHCnbiY4w/exec"; 

    function buscar() {
        var os = document.getElementById("busca").value;
        var div = document.getElementById("resultado");
        if(!os) return alert("Digite a OS");
        
        div.innerHTML = "⏳ Buscando...";

        fetch(`${LINK_SCRIPT}?action=buscar_os&os=${os}`)
        .then(r => r.json())
        .then(data => {
            div.innerHTML = "";
            if(data.length === 0) {
                div.innerHTML = "Não encontrado.";
                return;
            }
            data.forEach(p => {
                let btn = "";
                if(!p.conferido) {
                    btn = `<br><button onclick="confirmar('${p.os}')" style="background:#2ecc71; color:white;">CONFIRMAR SAÍDA</button>`;
                } else {
                    btn = `<div class="ok">✅ JÁ CONFERIDO</div>`;
                }

                div.innerHTML += `
                <div class="card">
                    <div class="line"><span>OS:</span> <span class="val">${p.os}</span></div>
                    <div class="line"><span>Cliente:</span> <span class="val">${p.cliente}</span></div>
                    <div class="line"><span>Modelo:</span> <span class="val">${p.modelo}</span></div>
                    <div class="line"><span>Qtd:</span> <span class="val">${p.qtd}</span></div>
                    <div class="line"><span>Peso Bruto:</span> <span class="val">${parseFloat(p.pesoBruto).toFixed(2)}g</span></div>
                    <div class="line"><span>Status:</span> <span class="val">${p.status}</span></div>
                    ${btn}
                </div>`;
            });
        });
    }

    function confirmar(os) {
        var loja = document.getElementById("loja").value;
        if(!loja) return alert("Selecione o Destino!");

        fetch(LINK_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                action: "REGISTRAR_CONFERENCIA",
                idUnico: "CONF-" + Date.now(),
                os: os,
                loja: loja,
                conferente: "Admin" // Pode pegar do sessionStorage se quiser
            })
        }).then(() => {
            alert("Sucesso!");
            buscar();
        });
    }
</script>
</body>
</html>
