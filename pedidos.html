<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pedidos - Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* [Seus estilos CSS originais permanecem aqui...] */
        :root { --bg-body: #121212; --bg-panel: #1e1e1e; --bg-input: #2c2c2c; --border: #333; --text: #fff; --primary: #D4AF37; --success: #2ecc71; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 900px; background: var(--bg-panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); box-sizing: border-box; }
        .btn { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; margin-top: 10px; width: 100%; }
        .btn-save { background: var(--success); }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Gestão de Pedidos</h2>

        <div class="form-row">
            <div class="input-group">
                <label>Cliente</label>
                <input type="text" id="cliente" placeholder="Nome do Cliente" onblur="buscarProximaOS()">
            </div>
            <div class="input-group">
                <label>Nº OS</label>
                <input type="text" id="os" placeholder="Aguardando cliente...">
            </div>
        </div>

        <div class="catalog-area" id="painel-adicao">
            <input list="lista-modelos" id="input-modelo" placeholder="🔍 Busque o modelo..." onchange="carregarGrade()">
            <datalist id="lista-modelos"></datalist>
            
            <div id="grade-wrapper" style="display:none; margin-top:15px;">
                <div id="container-aros" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap:5px;"></div>
                <button class="btn btn-save" onclick="adicionarProdutoManual()">⬇ INCLUIR NO PEDIDO</button>
            </div>
        </div>

        <table style="width:100%; margin-top:20px; border-collapse: collapse;">
            <thead><tr style="border-bottom: 2px solid var(--primary);"><th>Modelo</th><th>Qtd</th><th>Ação</th></tr></thead>
            <tbody id="lista-pedidos"></tbody>
        </table>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
            <button class="btn" style="background:var(--danger)" onclick="gerarPDF()">📄 PDF</button>
            <button class="btn btn-save" onclick="enviar('Pendente')">💾 FINALIZAR</button>
        </div>
    </div>

<script>
    const API_URL = "SUA_URL_DO_SCRIPT_AQUI"; "https://script.google.com/macros/s/AKfycbwruZnMwnZGo0Tc9WLgtbw6ozYNiDgYlJ55cDxCl0LLs98_H_75BQvyPcMpR04xwRiYBQ/exec"
    let carrinho = [], catalogo = [];

    window.onload = async function() {
        await carregarCatalogoNuvem();
    };

    // --- NOVA FUNÇÃO: BUSCA PRÓXIMA O.S. ---
    async function buscarProximaOS() {
        const campoOS = document.getElementById('os');
        const cliente = document.getElementById('cliente').value;

        // Só busca se o campo OS estiver vazio e houver um nome de cliente
        if (!campoOS.value && cliente.trim().length > 2) {
            try {
                campoOS.placeholder = "Consultando...";
                const res = await fetch(`${API_URL}?action=GERAR_PROXIMA_OS`);
                const dados = await res.json();
                if (dados.proximaOS) {
                    campoOS.value = dados.proximaOS;
                }
            } catch (e) {
                console.error("Erro OS:", e);
                campoOS.placeholder = "Erro ao buscar";
            }
        }
    }

    async function carregarCatalogoNuvem() {
        const res = await fetch(`${API_URL}?action=GET_PRODUCTS`);
        catalogo = await res.json();
        const dl = document.getElementById("lista-modelos");
        catalogo.forEach(p => { 
            let op = document.createElement("option"); 
            op.value = p.m; op.innerText = p.d; 
            dl.appendChild(op); 
        });
    }

    function carregarGrade() {
        document.getElementById("grade-wrapper").style.display = "block";
        const cont = document.getElementById("container-aros");
        cont.innerHTML = "";
        for(let i=10; i<=30; i++) {
            cont.innerHTML += `<div>${i}<input type="number" id="q-${i}" style="width:40px; padding:2px;"></div>`;
        }
    }

    function adicionarProdutoManual() {
        const mod = document.getElementById("input-modelo").value;
        const prod = catalogo.find(p => p.m === mod);
        let itens = [];
        for(let i=10; i<=30; i++) {
            let q = parseInt(document.getElementById(`q-${i}`).value) || 0;
            if(q > 0) itens.push({ aro: i, qtd: q, tipo: 'sem' });
        }
        carrinho.push({ produto: prod, grade: itens });
        renderTabela();
    }

    function renderTabela() {
        const body = document.getElementById("lista-pedidos");
        body.innerHTML = "";
        carrinho.forEach((c, idx) => {
            body.innerHTML += `<tr><td>${c.produto.m}</td><td>${c.grade.length}</td><td><button onclick="carrinho.splice(${idx},1);renderTabela()">🗑️</button></td></tr>`;
        });
    }

    function enviar(status) {
        const dados = {
            action: "SALVAR_PEDIDO",
            cliente: document.getElementById("cliente").value,
            os: document.getElementById("os").value,
            status: status,
            itens: carrinho.flatMap(c => c.grade.map(g => ({
                modelo: c.produto.d, referencia: c.produto.m, qtd: g.qtd, tipo: g.tipo, aro: g.aro, pa: c.produto.pa
            })))
        };
        fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) })
        .then(() => alert("Sucesso!"));
    }
</script>
</body>
</html>
